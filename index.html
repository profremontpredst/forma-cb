<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Форма заявки</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== GIGABOT CONFIG ===== -->
<script>
  window.GIGABOT_CONFIG = {
    endpoint: "https://gigabot-db4r.onrender.com",
    siteId: "site_forma_cb_w2tq_onrender_com",
    publicKey: "pk_live_7dabba895f0030db99ef11b4"
  };
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Segoe UI,Tahoma,sans-serif;
  background:#f6f8fb;color:#0c2f66;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:16px;
}
.form-box{
  background:#fff;border-radius:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
  padding:24px;width:min(400px,90vw);
}
h2{text-align:center;margin-bottom:20px;font-size:20px}
.field{display:grid;gap:6px;margin-bottom:14px}
label{font-size:14px;font-weight:600}
input{
  padding:10px;border:1px solid #DCE3EB;
  border-radius:8px;font-size:14px
}
button{
  width:100%;padding:12px;border:none;border-radius:8px;
  background:#0066FF;color:#fff;font-weight:600;
  cursor:pointer;font-size:15px
}
button:disabled{opacity:.6}
.muted{margin-top:10px;font-size:12px;text-align:center;color:#7c8a9a}
</style>
</head>

<body>

<div class="form-box">
  <h2>Оставьте номер WhatsApp</h2>

  <form id="leadForm">
    <div class="field">
      <label>Ваше имя</label>
      <input id="name" required placeholder="Иван">
    </div>

    <div class="field">
      <label>Телефон</label>
      <input id="phone" required placeholder="+7 (900) 000-00-00">
    </div>

    <!-- honeypot -->
    <input type="text" id="company" style="display:none">

    <button id="submitBtn">Отправить</button>
  </form>

  <div class="muted" id="status"></div>
</div>

<!-- ===== GIGABOT SCRIPT (БЕЗ defer, ВНИЗУ) ===== -->
<script src="https://gigabot-admin-biea.onrender.com/gigabot.js"></script>

<script>
document.getElementById("leadForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const honeypot = document.getElementById("company").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("submitBtn");

  if (honeypot) return;

  if (!name || phone.length < 10) {
    status.textContent = "Введите корректные данные";
    return;
  }

  btn.disabled = true;
  status.textContent = "Проверяем…";

  try {
    if (!window.GigaBot || typeof window.GigaBot.send !== "function") {
      throw new Error("GigaBot not loaded");
    }

    if (!window.GigaBot._uid) {
  window.GigaBot._uid = "user_" + Math.random().toString(36).slice(2, 10);
}

    // 1) АНТИБОТ
    const result = await window.GigaBot.send({
      type: "form",
      fields: { name, phone, honeypot }
    });

    // 2) BLOCK / DENY — МОЛЧА
    if (result.action !== "allow" && result.action !== "challenge") {
      status.textContent = "Заявка принята";
      return;
    }

    // 3) ALLOW / CHALLENGE — ЛИД
    const r = await fetch(window.GIGABOT_CONFIG.endpoint + "/lead", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        siteId: window.GIGABOT_CONFIG.siteId,
        publicKey: window.GIGABOT_CONFIG.publicKey,
        userId: window.GigaBot._uid,
        name,
        phone,
        utm: window.GigaBot._utm
      })
    });

    if (!r.ok) throw new Error("Lead request failed");

    status.textContent = "Заявка принята. Напишем в WhatsApp 👌";

  } catch (err) {
    console.error(err);
    status.textContent = "Ошибка, попробуйте позже";
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>
