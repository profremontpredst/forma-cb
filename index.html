<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Форма заявки</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===== GIGABOT CONFIG (ЕДИНСТВЕННОЕ, ЧТО НУЖНО) ===== -->
<script>
  window.GIGABOT_CONFIG = {
    endpoint: "https://gigabot-db4r.onrender.com",   // АНТИБОТ (НЕ АДМИНКА)
    siteId: "site_demo",                              // ИЗ АДМИНКИ
    publicKey: "pk_live_site_demo_001"                // ИЗ АДМИНКИ
  };
</script>
<script src="https://gigabot-admin-biea.onrender.com/gigabot.js" defer></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:#f6f8fb;color:#0c2f66;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:16px;
}
.form-box{
  background:#fff;border-radius:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
  padding:24px;width:min(400px,90vw);
}
h2{text-align:center;margin-bottom:20px;font-size:20px}
.field{display:grid;gap:6px;margin-bottom:14px}
label{font-size:14px;font-weight:600}
input{
  padding:10px;border:1px solid #DCE3EB;
  border-radius:8px;font-size:14px
}
button{
  width:100%;padding:12px;border:none;border-radius:8px;
  background:#0066FF;color:#fff;font-weight:600;
  cursor:pointer;font-size:15px
}
button:hover{background:#0053d1}
.muted{margin-top:10px;font-size:12px;text-align:center;color:#7c8a9a}
</style>
</head>

<body>

<div class="form-box">
  <h2>Оставьте номер WhatsApp</h2>

  <!-- ❗ ОБЫЧНАЯ ФОРМА -->
  <form method="POST" action="/success.html">
    <div class="field">
      <label>Ваше имя</label>
      <input name="name" placeholder="Иван" required>
    </div>

    <div class="field">
      <label>Телефон</label>
      <input name="phone" placeholder="+7 (900) 000-00-00" required>
    </div>

    <!-- honeypot (НЕ ТРОГАТЬ) -->
    <input type="text" name="company" style="display:none">

    <button type="submit">Отправить</button>
  </form>

  <div class="muted">Без звонков. Напишем в WhatsApp</div>
</div>

</body>
</html>
